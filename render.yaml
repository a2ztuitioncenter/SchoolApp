services:
  - type: web
    name: tuition-app-backend
    runtime: node
    region: oregon
    plan: free
    root: backend
    
    # Build command - install dependencies
    buildCommand: npm install
    
    # Start command - run with Node.js (not bun)
    startCommand: node src/server.js
    
    # Environment variables - set these in Render dashboard
    envVars:
      - key: NODE_ENV
        value: production
    
    # Health check
    routes:
      - type: http
        path: /health
        
dependencies: []
