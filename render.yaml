services:
  - type: web
    name: tuition-app-backend
    runtime: node
    region: oregon
    plan: free
    
    # Build command - use root npm scripts
    buildCommand: npm run build
    
    # Start command - use root npm scripts
    startCommand: npm start
    
    # Environment variables - set these in Render dashboard
    envVars:
      - key: NODE_ENV
        value: production
    
    # Health check
    routes:
      - type: http
        path: /health
        
dependencies: []
