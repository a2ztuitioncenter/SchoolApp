[build]
  base    = "frontend"
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://schoolapp-bu95.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://schoolapp-bu95.onrender.com/uploads/:splat"
