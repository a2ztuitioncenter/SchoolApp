<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | A2Z Tuition App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container, .register-container {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            width: 100%;
            max-width: 450px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .subtitle {
            color: #666666;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            color: #1a1a1a;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            background-color: #f8f9fa;
            color: #1a1a1a;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #0052cc;
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1);
        }

        .error-message {
            background-color: rgba(207, 34, 46, 0.1);
            color: #cf222e;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #cf222e;
        }

        .success-message {
            background-color: rgba(26, 127, 55, 0.1);
            color: #1a7f37;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #238636;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #0052cc;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover:not(:disabled) {
            background-color: #0043a8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #666666;
        }

        .footer a {
            color: #0052cc;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #0052cc;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .admin-badge, .teacher-badge {
            display: inline-block;
            background-color: rgba(31, 111, 235, 0.15);
            color: #388bfd;
            border: 1px solid rgba(31, 111, 235, 0.4);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .role-badge {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-weight: 500;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .login-container, .register-container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">🏛️</div>
        <div class="admin-badge">Admin Panel</div>
        <h1>A2Z</h1>
        <p class="subtitle">Administrator Portal</p>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="admin-login-form" onsubmit="return false;">
            <div class="form-group">
                <label for="admin-phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="admin-phone" 
                    placeholder="10-digit mobile number"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>
                <input 
                    type="password" 
                    id="admin-password" 
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="button" id="admin-login-btn">Login as Admin</button>
        </form>

        <div class="footer">
            <p>For development: Use admin credentials</p>
            <p><a href="/index.html">← Back to Student Login</a></p>
        </div>
    </div>

    <script type="module" src="./src/modules/admin/admin-login.js"></script>
</body>
</html>
