<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Academy Tuition App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1.8rem;
            color: #2D3436;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #636E72;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            color: #2D3436;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #DDE4E9;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }

        input[type="tel"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .error-message {
            background: #FADBD8;
            color: #78281F;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #E74C3C;
        }

        .success-message {
            background: #D5F4E6;
            color: #186A3B;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #27AE60;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #636E72;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .role-badge {
            margin-top: 1rem;
            padding: 0.75rem;
            background: #F0F3FF;
            border-radius: 8px;
            color: #667eea;
            font-weight: 500;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">🏛️</div>
        <div class="admin-badge">Admin Panel</div>
        <h1>Academy</h1>
        <p class="subtitle">Administrator Portal</p>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="admin-login-form" onsubmit="return false;">
            <div class="form-group">
                <label for="admin-phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="admin-phone" 
                    placeholder="10-digit mobile number"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>
                <input 
                    type="password" 
                    id="admin-password" 
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="button" id="admin-login-btn">Login as Admin</button>
        </form>

        <div class="footer">
            <p>For development: Use admin credentials</p>
            <p><a href="/index.html">← Back to Student Login</a></p>
        </div>
    </div>

    <script type="module" src="./js/admin-login.js"></script>
</body>
</html>
