<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | A2Z</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #F5F7FA;
        }

        .teacher-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 1.5rem;
            position: fixed;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .sidebar .logout-btn {
            margin-top: 2rem;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.3s;
        }

        .sidebar .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #2D3436;
            font-size: 2rem;
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #667eea;
        }

        .stat-card h3 {
            color: #636E72;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: #2D3436;
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #DDE4E9;
            flex-wrap: wrap;
        }

        .tab-button {
            background: none;
            border: none;
            padding: 1rem;
            font-size: 1rem;
            color: #636E72;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        th {
            background: #F8FAFC;
            padding: 1rem;
            text-align: left;
            color: #2D3436;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 2px solid #DDE4E9;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #DDE4E9;
            color: #636E72;
        }

        tr:hover {
            background: #F8FAFC;
        }

        .empty-state {
            text-align: center;
            padding: 2rem !important;
            color: #95A5A6;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-active {
            background: #D5F4E6;
            color: #186A3B;
        }

        .status-pending {
            background: #FEF5E7;
            color: #7D6608;
        }

        /* Form */
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            margin-bottom: 2rem;
        }

        .form-container h3 {
            color: #2D3436;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #2D3436;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #DDE4E9;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            border-left: 4px solid;
        }

        .alert.success {
            background: #D5F4E6;
            color: #186A3B;
            border-left-color: #27AE60;
        }

        .alert.error {
            background: #FADBD8;
            color: #78281F;
            border-left-color: #E74C3C;
        }

        .alert.info {
            background: #D6EAF8;
            color: #154360;
            border-left-color: #3498DB;
        }

        @media (max-width: 768px) {
            .teacher-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                height: auto;
                width: 100%;
            }

            .main-content {
                margin-left: 0;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="teacher-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                A2Z
            </div>
            <nav>
                <a href="#" class="nav-link active" data-tab="dashboard">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="#" class="nav-link" data-tab="homework">
                    <i class="fas fa-tasks"></i> My Classes
                </a>
                <a href="#" class="nav-link" data-tab="manage">
                    <i class="fas fa-plus-circle"></i> Add Homework
                </a>
            </nav>
            <button class="logout-btn" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>Teacher Dashboard</h1>
                <div class="teacher-info">
                    <i class="fas fa-user-circle" style="font-size: 2rem; color: #667eea;"></i>
                    <div>
                        <div style="color: #2D3436; font-weight: 600;" id="teacher-name">Teacher</div>
                        <div style="color: #636E72; font-size: 0.9rem;">Educator</div>
                    </div>
                </div>
            </div>

            <!-- Alerts -->
            <div id="success-alert" class="alert success">
                <span id="success-text"></span>
            </div>
            <div id="error-alert" class="alert error">
                <span id="error-text"></span>
            </div>
            <div id="info-alert" class="alert info">
                <span id="info-text"></span>
            </div>

            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Classes</h3>
                        <div class="stat-value" id="total-classes">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total Students</h3>
                        <div class="stat-value" id="total-students">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Active Homework</h3>
                        <div class="stat-value" id="total-homework">0</div>
                    </div>
                </div>

                <h2 style="color: #2D3436; margin-bottom: 1.5rem;">My Classes</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Class Level</th>
                            <th>Section</th>
                            <th>Students</th>
                            <th>Active Homework</th>
                        </tr>
                    </thead>
                    <tbody id="classes-list">
                        <tr>
                            <td colspan="4" class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <p>No classes assigned yet.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Homework Tab -->
            <div id="homework" class="tab-content">
                <div class="tabs" style="border-bottom: 1px solid #DDE4E9;">
                    <button class="tab-button active" data-tab="homework-active">Active Homework</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Class</th>
                            <th>Title</th>
                            <th>Due Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="homework-list">
                        <tr>
                            <td colspan="4" class="empty-state">
                                <i class="fas fa-clipboard"></i>
                                <p>No homework assignments yet.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Manage Tab -->
            <div id="manage" class="tab-content">
                <div class="form-container">
                    <h3>Add New Homework</h3>
                    <form id="add-homework-form">
                        <div class="form-group">
                            <label for="class-level">Class Level</label>
                            <input type="text" id="class-level" placeholder="e.g., 9A, 10B" required>
                        </div>

                        <div class="form-group">
                            <label for="section">Section</label>
                            <input type="text" id="section" placeholder="e.g., A, B, C" required>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="e.g., Mathematics" required>
                        </div>

                        <div class="form-group">
                            <label for="title">Homework Title</label>
                            <input type="text" id="title" placeholder="Title of homework" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" placeholder="Homework description" rows="4" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="due-date">Due Date</label>
                            <input type="date" id="due-date" required>
                        </div>

                        <button type="submit">Add Homework</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/teacher-dashboard.js"></script>
</body>
</html>
