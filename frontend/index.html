<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2Z Tuition - Premier Online Learning</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./src/assets/css/index.css">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="container">
                <div class="logo">
                    <span>A2Z Tuition</span>
                </div>
                <nav style="display: flex; align-items: center; gap: 20px;">
                    <ul>
                        <li><a id="header-login" href="#" onclick="openAuthLoginSelector(event)"><i class="fa fa-user"></i> Log in</a></li>
                        <li><a id="header-signup" href="#" onclick="openAuthSignupSelector(event)"><i class="fa fa-plus-square"></i> Sign up</a></li>
                    </ul>
                </nav>
            </div>
        </div>
        <div class="header-bottom">
            <div class="container">
                <nav>
                    <ul>
                        <li><a href="#programs">Programs</a></li>
                        <li><a href="#resources">Resources</a></li>
                        <li><a href="#contact">Contact Us</a></li>
                        <li><a href="#privacy">Privacy</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <!-- Modern Animated Hero Section -->
        <section class="hero-animated" id="heroSection">
            <!-- Animated Background SVG -->
            <svg class="hero-background" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#0052cc;stop-opacity:0.4" />
                        <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#0052cc;stop-opacity:0.4" />
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <!-- Animated flowing lines -->
                <path class="flow-line flow-line-1" d="M 0 100 Q 300 50, 600 100 T 1200 100" stroke="url(#lineGradient)" stroke-width="2" fill="none" filter="url(#glow)"/>
                <path class="flow-line flow-line-2" d="M 0 250 Q 300 200, 600 250 T 1200 250" stroke="url(#lineGradient)" stroke-width="2" fill="none" filter="url(#glow)"/>
                <path class="flow-line flow-line-3" d="M 0 400 Q 300 350, 600 400 T 1200 400" stroke="url(#lineGradient)" stroke-width="2" fill="none" filter="url(#glow)"/>
                <path class="flow-line flow-line-4" d="M 0 550 Q 300 500, 600 550 T 1200 550" stroke="url(#lineGradient)" stroke-width="2" fill="none" filter="url(#glow)"/>
                <path class="flow-line flow-line-5" d="M 0 700 Q 300 650, 600 700 T 1200 700" stroke="url(#lineGradient)" stroke-width="2" fill="none" filter="url(#glow)"/>
            </svg>

            <!-- Hero Content -->
            <div class="hero-content-modern">
                <div class="content-wrapper">
                    <!-- Animated Title -->
                    <h1 class="hero-title-animated" id="heroTitle">Welcome to A2Z Tuition</h1>
                    
                    <!-- Subtitle -->
                    <p class="hero-subtitle-modern" id="heroSubtitle">Empowering students through quality online education</p>
                    
                    <!-- Description -->
                    <p class="hero-description">Join thousands of students and teachers for an enhanced learning experience</p>
                    
                    <!-- CTA Buttons -->
                    <div class="hero-cta-group">
                        <button class="btn-glass" id="btn-get-started-hero" onclick="openAuthLoginSelector(event)">
                            <span class="btn-text">Get Started</span>
                            <span class="btn-arrow">→</span>
                        </button>
                        <button class="btn-outline" onclick="const el = document.getElementById('programs'); if(el) el.scrollIntoView({behavior: 'smooth'})">
                            <span class="btn-text">Learn More</span>
                        </button>
                    </div>
                </div>

                <!-- Floating Elements -->
                <div class="floating-element element-1"></div>
                <div class="floating-element element-2"></div>
                <div class="floating-element element-3"></div>
            </div>
        </section>
        

        <!-- Central Auth Modal -->
        <div class="auth-modal hidden" id="authModal">
            <div class="modal-overlay" onclick="closeAuthModal()"></div>
            <div class="modal-container">
                <button class="modal-close" onclick="closeAuthModal()" aria-label="Close modal"><i class="fas fa-times"></i></button>
                <div id="authContent"></div>
            </div>
        </div>

        <!-- Hidden Form Containers (for modal injection) -->
        
        <!-- Student Login Form -->
        <!-- Student Login Form -->
        <template id="studentLoginForm">
            <div class="modal-header">
                <div class="modal-logo"><i class="fas fa-graduation-cap"></i></div>
                <div class="student-badge">Student Login</div>
                <h2>A2Z</h2>
                <p class="modal-subtitle">Welcome back! Enter your details to continue.</p>
            </div>
            <div class="error-message" id="studentLoginError"></div>
            <div class="success-message" id="studentLoginSuccess"></div>
            <form id="studentLoginFormElement">
                <div class="form-group">
                    <label for="student-login-phone">Phone Number</label>
                    <input type="tel" id="student-login-phone" name="phone" placeholder="Enter your 10-digit phone number" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label for="student-login-password">Password</label>
                    <input type="password" id="student-login-password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" id="studentLoginBtn" class="btn-submit">Log In</button>
            </form>
            <div class="modal-footer">
                <p>Don't have an account? <a href="#" onclick="openAuthModal('signup', 'student')">Sign up</a></p>
            </div>
        </template>

        <!-- Teacher Login Form -->
        <template id="teacherLoginForm">
            <div class="modal-header">
                <div class="modal-logo"><i class="fas fa-chalkboard-user"></i></div>
                <div class="teacher-badge">Teacher Portal</div>
                <h2>A2Z</h2>
                <p class="modal-subtitle">Educator Access Portal</p>
            </div>
            <div class="error-message" id="teacherLoginError"></div>
            <div class="success-message" id="teacherLoginSuccess"></div>
            <form id="teacherLoginFormElement">
                <div class="form-group">
                    <label for="teacher-login-phone">Phone Number</label>
                    <input type="tel" id="teacher-login-phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label for="teacher-login-password">Password</label>
                    <input type="password" id="teacher-login-password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="button" id="teacherLoginBtn" class="btn-submit">Login as Teacher</button>
            </form>
            <div class="modal-footer">
                <p>Don't have an account? <a href="#" onclick="openAuthModal('signup', 'teacher')">Sign up</a></p>
            </div>
        </template>

        <!-- Admin Login Form -->
        <template id="adminLoginForm">
            <div class="modal-header">
                <div class="modal-logo"><i class="fas fa-building"></i></div>
                <div class="admin-badge">Admin Panel</div>
                <h2>A2Z</h2>
                <p class="modal-subtitle">Administrator Portal</p>
            </div>
            <div class="error-message" id="adminLoginError"></div>
            <div class="success-message" id="adminLoginSuccess"></div>
            <form id="adminLoginFormElement">
                <div class="form-group">
                    <label for="admin-login-phone">Phone Number</label>
                    <input type="tel" id="admin-login-phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label for="admin-login-password">Password</label>
                    <input type="password" id="admin-login-password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="button" id="adminLoginBtn" class="btn-submit">Login as Admin</button>
            </form>
            <div class="modal-footer">
                <p><a href="#" onclick="openAuthModal('login', 'student')">← Back to Login</a></p>
            </div>
        </template>

        <!-- Student Signup Form -->
        <template id="studentSignupForm">
            <div class="modal-header modal-header-dark">
                <div class="modal-logo"><i class="fas fa-user-plus"></i></div>
                <h2>Student Registration</h2>
                <p class="modal-subtitle">Join A2Z Tuition today and start your learning journey.</p>
            </div>
            <div class="error-message" id="studentSignupError"></div>
            <div class="success-message" id="studentSignupSuccess"></div>
            <form id="studentSignupFormElement">
                <!-- Personal Information -->
                <div class="form-section-title">Personal Information</div>
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-firstName">First Name *</label>
                        <input type="text" id="student-signup-firstName" placeholder="First name" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-lastName">Last Name</label>
                        <input type="text" id="student-signup-lastName" placeholder="Last name (optional)">
                    </div>
                </div>

                <!-- Academic Information -->
                <div class="form-section-title">Academic Information</div>
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-class">Class Level *</label>
                        <select id="student-signup-class" required>
                            <option value="">Select</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-section">Section *</label>
                        <select id="student-signup-section" required>
                            <option value="">Select</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                        </select>
                    </div>
                </div>

                <!-- Contact & Login -->
                <div class="form-section-title">Contact & Credentials</div>
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-phone">Phone Number *</label>
                        <input type="tel" id="student-signup-phone" placeholder="10-digit number" pattern="[0-9]{10}" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-email">Email</label>
                        <input type="email" id="student-signup-email" placeholder="student@a2z.local">
                    </div>
                </div>
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-password">Password *</label>
                        <input type="password" id="student-signup-password" placeholder="Create password" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-confirm">Confirm Password *</label>
                        <input type="password" id="student-signup-confirm" placeholder="Confirm password" required>
                    </div>
                </div>

                <!-- Parent Information -->
                <div class="form-section-title">Parent Information</div>
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-fatherName">Father's Name *</label>
                        <input type="text" id="student-signup-fatherName" placeholder="Father's full name" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="student-signup-motherName">Mother's Name *</label>
                        <input type="text" id="student-signup-motherName" placeholder="Mother's full name" required>
                    </div>
                </div>

                <button type="submit" id="studentSignupBtn" class="btn-submit">Sign Up</button>
            </form>
            <div class="modal-footer">
                <p>Already have an account? <a href="#" onclick="openAuthModal('login', 'student')">Log in</a></p>
            </div>
        </template>

        <!-- Teacher Signup Form -->
        <template id="teacherSignupForm">
            <div class="modal-header">
                <div class="modal-logo"><i class="fas fa-chalkboard-user"></i></div>
                <div class="teacher-badge">Teacher/Staff</div>
                <h2>Teacher Registration</h2>
                <p class="modal-subtitle">Join A2Z Tuition and inspire students to learn!</p>
            </div>
            <div class="error-message" id="teacherSignupError"></div>
            <div class="success-message" id="teacherSignupSuccess"></div>
            <form id="teacherSignupFormElement">
                <div class="form-group">
                    <label for="teacher-signup-role">I am a *</label>
                    <select id="teacher-signup-role" required>
                        <option value="">-- Select role --</option>
                        <option value="teacher">Teacher</option>
                        <option value="staff">Staff</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="teacher-signup-name">Full Name</label>
                    <input type="text" id="teacher-signup-name" name="name" placeholder="John Smith" required>
                </div>
                <div class="form-group">
                    <label for="teacher-signup-email">Email Address</label>
                    <input type="email" id="teacher-signup-email" name="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="teacher-signup-phone">Phone Number</label>
                    <input type="tel" id="teacher-signup-phone" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label for="teacher-signup-password">Password</label>
                    <input type="password" id="teacher-signup-password" name="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="teacher-signup-confirm">Confirm Password</label>
                    <input type="password" id="teacher-signup-confirm" name="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" id="teacherSignupBtn" class="btn-submit">Sign Up</button>
            </form>
            <div class="modal-footer">
                <p>Already have an account? <a href="#" onclick="openAuthModal('login', 'teacher')">Log in</a></p>
            </div>
        </template>

        <!-- Unified Registration Form (Student, Teacher, Staff) -->
        <template id="unifiedSignupForm">
            <div class="modal-header modal-header-dark">
                <div class="modal-logo"><i class="fas fa-user-plus"></i></div>
                <h2>Register for A2Z Tuition</h2>
                <p class="modal-subtitle">Select your role to get started.</p>
            </div>
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>
            <form id="register-form">
                <!-- Role Selection -->
                <div class="form-group">
                    <label for="role-select">Select Your Role *</label>
                    <select id="role-select" required>
                        <option value="">-- Choose a role --</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="staff">Staff</option>
                    </select>
                </div>

                <!-- Common Fields -->
                <div class="form-group">
                    <label for="name-input">Full Name *</label>
                    <input type="text" id="name-input" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="phone-input">Phone Number *</label>
                    <input type="tel" id="phone-input" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>

                <!-- Student-Specific Fields -->
                <div id="student-fields" style="display: none;">
                    <div class="form-section-title">Academic Information</div>
                    <div class="form-row" style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="class-level-select">Class Level *</label>
                            <select id="class-level-select">
                                <option value="">Select</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="section-input">Section *</label>
                            <input type="text" id="section-input" placeholder="A, B, C, etc." maxlength="1">
                        </div>
                    </div>

                    <div class="form-section-title">Parent Information</div>
                    <div class="form-row" style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="father-name-input">Father's Name *</label>
                            <input type="text" id="father-name-input" placeholder="Father's full name">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="mother-name-input">Mother's Name *</label>
                            <input type="text" id="mother-name-input" placeholder="Mother's full name">
                        </div>
                    </div>
                </div>

                <!-- Teacher/Staff-Specific Fields -->
                <div id="teacher-staff-fields" style="display: none;">
                    <div class="form-group">
                        <label for="email-input">Email Address *</label>
                        <input type="email" id="email-input" placeholder="your.email@example.com">
                    </div>
                </div>

                <!-- Common Password Fields -->
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="password-input">Password *</label>
                        <input type="password" id="password-input" placeholder="Create a password" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="confirm-password-input">Confirm Password *</label>
                        <input type="password" id="confirm-password-input" placeholder="Confirm your password" required>
                    </div>
                </div>

                <button type="submit" id="register-btn" class="btn-submit">Sign Up</button>
            </form>
            <div class="modal-footer">
                <p>Already have an account? <a href="#" onclick="openAuthModal('login', 'student')">Log in</a></p>
            </div>
        </template>
    </main>

    <footer>

    </footer>

    <!-- Light mode only: Force light theme -->
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
        
        // Polyfill: Create placeholder functions in global scope for inline event handlers
        // These will be replaced by actual implementations when modules load
        // Retry counter to prevent infinite loops
        const retryAttempt = {};
        
        window.openAuthModal = window.openAuthModal || function(type, role) {
            retryAttempt['openAuthModal'] = (retryAttempt['openAuthModal'] || 0) + 1;
            if (retryAttempt['openAuthModal'] <= 2) {
                setTimeout(() => window.openAuthModal(type, role), 100);
            }
        };
        window.openAuthLoginSelector = window.openAuthLoginSelector || function(e) {
            e?.preventDefault?.();
            retryAttempt['openAuthLoginSelector'] = (retryAttempt['openAuthLoginSelector'] || 0) + 1;
            if (retryAttempt['openAuthLoginSelector'] <= 2) {
                setTimeout(() => window.openAuthLoginSelector(e), 100);
            }
        };
        window.openAuthSignupSelector = window.openAuthSignupSelector || function(e) {
            e?.preventDefault?.();
            retryAttempt['openAuthSignupSelector'] = (retryAttempt['openAuthSignupSelector'] || 0) + 1;
            if (retryAttempt['openAuthSignupSelector'] <= 2) {
                setTimeout(() => window.openAuthSignupSelector(e), 100);
            }
        };
        window.closeAuthModal = window.closeAuthModal || function() {
            // No retry needed for close
        };
    </script>
    <script type="module" src="./src/core/auth-modal.js"></script>
    <script type="module" src="./src/core/unified-register.js"></script>
    <script type="module" src="./src/core/index.js"></script>
</body>
</html>
