<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | A2Z Tuition App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container, .register-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            width: 100%;
            max-width: 450px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            color: #c9d1d9;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            color: #c9d1d9;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            background-color: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1f6feb;
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.3);
        }

        .error-message {
            background-color: rgba(218, 54, 51, 0.15);
            color: #f85149;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #da3633;
        }

        .success-message {
            background-color: rgba(35, 134, 54, 0.15);
            color: #3fb950;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #238636;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #1f6feb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover:not(:disabled) {
            background-color: #388bfd;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #8b949e;
        }

        .footer a {
            color: #1f6feb;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #1f6feb;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .admin-badge, .teacher-badge {
            display: inline-block;
            background-color: rgba(31, 111, 235, 0.15);
            color: #388bfd;
            border: 1px solid rgba(31, 111, 235, 0.4);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .role-badge {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-weight: 500;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .login-container, .register-container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="logo">🎓</div>
    <h1>Student Registration</h1>
    <p class="subtitle">Join A2Z Tuition today and start your learning journey!</p>

    <div class="error-message" id="error-message"></div>
    <div class="success-message" id="success-message"></div>

    <form id="register-form">
        <div class="form-group">
            <label for="name-input">Full Name</label>
            <input type="text" id="name-input" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="phone-input">Phone Number</label>
            <input type="tel" id="phone-input" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label for="class-input">Class Level</label>
            <select id="class-input" name="classLevel" required>
                <option value="">Select your class</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
            </select>
        </div>

        <button type="submit" id="register-btn">Sign Up</button>
    </form>

    <div class="footer">
        <p>Already have an account? <a href="/student-login.html">Log In</a></p>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</div>

<script type="module" src="./src/modules/student/student-register.js"></script>

</body>
</html>
