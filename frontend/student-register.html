<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | A2Z Tuition App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.6rem;
            color: #2D3436;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #636E72;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            color: #2D3436;
            font-weight: 500;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid #DDE4E9;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .error-message {
            background: #FADBD8;
            color: #78281F;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.85rem;
            border-left: 4px solid #E74C3C;
        }

        .success-message {
            background: #D5F5E3;
            color: #145A32;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.85rem;
            border-left: 4px solid #2ECC71;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 0.5rem;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #636E72;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #667eea;
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="logo">🎓</div>
    <h1>Student Registration</h1>
    <p class="subtitle">Join A2Z Tuition today and start your learning journey!</p>

    <div class="error-message" id="error-message"></div>
    <div class="success-message" id="success-message"></div>

    <form id="register-form">
        <div class="form-group">
            <label for="name-input">Full Name</label>
            <input type="text" id="name-input" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="phone-input">Phone Number</label>
            <input type="tel" id="phone-input" name="phone" placeholder="10-digit number" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label for="class-input">Class Level</label>
            <select id="class-input" name="classLevel" required>
                <option value="">Select your class</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
            </select>
        </div>

        <button type="submit" id="register-btn">Sign Up</button>
    </form>

    <div class="footer">
        <p>Already have an account? <a href="/student-login.html">Log In</a></p>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</div>

<script type="module" src="./js/student-register.js"></script>

</body>
</html>
