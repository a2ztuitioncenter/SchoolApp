<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Login | A2Z Tuition App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .parent-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #999;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #f5576c;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .error-message {
            display: none;
            background: #fadbd8;
            color: #78281f;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #e74c3c;
            font-size: 0.9rem;
        }

        .success-message {
            display: none;
            background: #d5f4e6;
            color: #186a3b;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #27ae60;
            font-size: 0.9rem;
        }

        .links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .links a {
            color: #f5576c;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        .links a:hover {
            opacity: 0.7;
        }

        .login-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .login-links a {
            color: #999;
            text-decoration: none;
        }

        .login-links a:hover {
            color: #f5576c;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 0.5rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(245, 87, 108, 0.3);
            border-top-color: #f5576c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .logo {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">👨‍👩‍👧</div>
        <div class="parent-badge">Parent Portal</div>
        <h1>Welcome</h1>
        <p class="subtitle">Login to track your child's progress</p>

        <form id="login-form">
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <div class="form-group">
                <label for="phone-input">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone-input" 
                    placeholder="Enter 10-digit phone number" 
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password-input">Password</label>
                <input 
                    type="password" 
                    id="password-input" 
                    placeholder="Enter password" 
                    required
                >
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 0.5rem; color: #999;">Logging in...</p>
            </div>

            <button type="submit" class="submit-btn" id="login-btn">Login</button>
        </form>

        <div class="links">
            <p>Back to <a href="/pages/master_dashboard.html">home</a></p>
            <div class="login-links">
                <a href="/index.html">Student Login</a>
                <span style="color: #ddd;">|</span>
                <a href="/teacher-login.html">Teacher Login</a>
                <span style="color: #ddd;">|</span>
                <a href="/admin-login.html">Admin Login</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { authAPI } from './js/api.js';

        const form = document.getElementById('login-form');
        const phoneInput = document.getElementById('phone-input');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', handleParentLogin);

        async function handleParentLogin(event) {
            event.preventDefault();
            
            const phone = phoneInput.value.trim();
            const password = passwordInput.value;

            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Validation
            if (phone.length !== 10) {
                showError('Phone number must be 10 digits');
                return;
            }

            if (!password) {
                showError('Password is required');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            loginBtn.disabled = true;

            try {
                console.log('🔐 Attempting parent login...');
                const response = await authAPI.parentLogin(phone, password);

                console.log('✅ Login response:', response);

                if (response.success) {
                    successMessage.textContent = '✅ Login successful! Redirecting...';
                    successMessage.style.display = 'block';

                    // Store parent info in session
                    sessionStorage.setItem('parentUserId', response.user.id);
                    sessionStorage.setItem('parentPhone', response.user.phone);
                    sessionStorage.setItem('role', 'parent');

                    console.log('📍 Redirecting to parent dashboard...');
                    setTimeout(() => {
                        window.location.href = '/parent-dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(response.error || 'Login failed');
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                showError(error.message || 'Failed to login. Please check your credentials.');
            } finally {
                loading.style.display = 'none';
                loginBtn.disabled = false;
            }
        }

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
